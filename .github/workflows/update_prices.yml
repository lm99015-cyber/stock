# 기능 : 한국 증시 장중(평일 09:00~15:30 KST)에 10분마다 시세를 받아 prices.json을 자동 갱신
# 설치 : 저장소의 .github/workflows/update_prices.yml 경로에 이 파일을 저장
name: update-stock-prices

on:
  schedule:
    # 기능 : KST 09:00~15:30 = UTC 00:00~06:30, 평일에만 10분 간격 실행
    - cron: "*/10 0-6 * * 1-5"
  # 기능 : Actions 탭에서 수동 실행 버튼 제공 (테스트용)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 기능 : 저장소 코드 내려받기
      - uses: actions/checkout@v4

      # 기능 : 시세 수집 스크립트 실행
      - name: Fetch prices
        run: python fetch_prices.py

      # 기능 : prices.json에 변경이 있을 때만 커밋/푸시
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "update prices [skip ci]"
          git push
